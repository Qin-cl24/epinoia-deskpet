<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
  body { display: flex; align-items: flex-end; justify-content: center; }

  /* 气泡 (窗口顶部) */
  .bubble {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,.95); color: #333; padding: 2px 6px;
    border-radius: 6px; font-size: 10px; white-space: nowrap;
    box-shadow: 0 1px 3px rgba(0,0,0,.25); opacity: 0; transition: opacity .3s;
    max-width: 42px; overflow: hidden; text-overflow: ellipsis;
    z-index: 10; pointer-events: none;
  }
  .bubble.show { opacity: 1; }

  /* ===== 桌宠形象 ===== */
  .pet {
    position: relative; width: 68px; height: 36px;
    animation: idle 2.5s ease-in-out infinite;
  }
  @keyframes idle { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
  .pet.bounce { animation: bounce .4s ease; }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }

  /* 主体：横向长方形 52×24（气泡已独立成悬浮窗，不再留头顶空间） */
  .body {
    position: relative;
    width: 52px; height: 24px; background: var(--pet-body, #e67e22);
    margin: 4px auto 0;
  }
  /* 眼睛（两只） */
  .eye { position: absolute; width: 6px; height: 6px; background: #000; top: 6px; transition: height .1s, width .15s, transform .15s, border-radius .15s; }
  .eye-left { left: 10px; } .eye-right { right: 10px; }
  .pet.blink .eye { height: 2px; }
  /* 手：小正方形、与身体同色、垂直居中、紧贴身体两侧无缝隙 */
  .arm { position: absolute; width: 8px; height: 8px; background: var(--pet-body, #e67e22); top: 8px; }
  .arm-left { left: -8px; } .arm-right { right: -8px; }
  /* 腿：两条，分开在下方 */
  .leg { position: absolute; width: 8px; height: 6px; background: var(--pet-leg, #d35400); bottom: -6px; border-radius: 0 0 4px 4px; }
  .leg-left { left: 10px; } .leg-right { right: 10px; }

  /* ===== 自主小动作特效 ===== */
  .fx { position: absolute; display: none; pointer-events: none; z-index: 5; font-size: 9px; }
  .fx.show { display: block; animation: fxrise 1.2s ease-out forwards; }
  @keyframes fxrise { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-14px) scale(1.4); } }
  .fx-heart { top: -6px; left: 30px; }
  .fx-tear  { top: 22px; left: 13px; }
  .fx-tear.r{ top: 22px; left: auto; right: 13px; }
  .fx-star  { top: -6px; left: 46px; }
  .fx-zzz   { top: -9px; left: 42px; font-size: 7px; }
  .fx-smoke { top: -9px; left: 8px; }
  .fx-bubble { top: 6px; left: 6px; font-size: 7px; }
  .fx-music { top: -8px; left: 27px; font-size: 10px; }
  .fx-note { font-size: 7px; }
  .fx-note.n1 { top: -6px; left: 6px; animation-delay: .1s; }
  .fx-note.n2 { top: 0px;  left: 58px; animation-delay: .35s; }
  .fx-note.n3 { top: -10px; left: 38px; animation-delay: .6s; }
  .fx-exclaim { top: -8px; left: 30px; font-size: 11px; color: #e53935; font-weight: bold; }
  .fx-question { top: -10px; left: 30px; font-size: 10px; color: #666; font-weight: bold; }
  .fx-confetti { font-size: 8px; }
  .fx-confetti.c1 { top: -4px; left: 4px; animation-delay: 0s; }
  .fx-confetti.c2 { top: -2px; left: 56px; animation-delay: .2s; }
  .fx-confetti.c3 { top: -8px; left: 30px; animation-delay: .4s; }

  /* 动作表情 */
  .act-happy .eye { height: 2px; border-radius: 50%; }
  .act-sleepy .eye { height: 2px; }
  .act-sleepy { animation: yawn 2.4s ease-in-out infinite; }
  @keyframes yawn { 0%,100% { transform: translateY(0) scaleY(1); } 25% { transform: translateY(-3px) scaleY(1.1); } 50% { transform: translateY(0) scaleY(1); } }
  .act-angry .eye-left { transform: rotate(-45deg); }
  .act-angry .eye-right { transform: rotate(45deg); }
  .act-angry { animation: shake .3s ease-in-out 6; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } }
  .act-cry .eye { height: 2px; border-radius: 50%; }
  .act-cry { animation: crybob 1.2s ease-in-out infinite; }
  @keyframes crybob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(1px); } }
  .act-proud .eye { height: 2px; }
  .act-proud { animation: proudbob .8s ease-in-out infinite; }
  @keyframes proudbob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  .act-wiggle { animation: wiggle .5s ease-in-out 4; }
  @keyframes wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-7deg); } 75% { transform: rotate(7deg); } }
  .act-music { animation: wiggle .45s ease-in-out 6; }
  .act-shock { animation: bounce .35s ease 2; }
  .act-think { animation: thinkbob 1s ease-in-out infinite; }
  @keyframes thinkbob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
  .act-celebrate { animation: wiggle .3s ease-in-out 6; }
  .act-cute .eye { width: 8px; height: 8px; border-radius: 50%; }
  .act-run { animation: run .15s linear infinite; }
  @keyframes run { 0%,100% { transform: translateY(0) rotate(0); } 25% { transform: translateY(-1px) rotate(-4deg); } 75% { transform: translateY(1px) rotate(4deg); } }
  /* 趴键盘 */
  .act-crouch { animation: crouch 1.5s ease-in-out infinite; }
  @keyframes crouch { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(.8) translateY(3px); } }
  /* 睡着 */
  .pet.asleep { opacity: .65; animation: none; }
  /* 完全隐藏时显示边缘手柄 */
  .handle {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-size: 20px; color: rgba(230, 126, 34, .55); display: none; z-index: 20;
    line-height: 1;
  }
  .pet.handle-mode .body, .pet.handle-mode .fx, .pet.handle-mode .bubble { display: none; }
  .pet.handle-mode .handle { display: block; }
  /* 翻滚动作 */
  .act-roll { animation: roll .6s ease 1; }
  @keyframes roll { from { transform: rotate(0); } to { transform: rotate(360deg); } }

  /* ===== 皮肤（CSS 变量，设置页可切）===== */
  .pet[data-skin="peach"] { --pet-body:#f48fb1; --pet-leg:#ec407a; --pet-accent:#f06292; }
  .pet[data-skin="mint"]  { --pet-body:#66bb6a; --pet-leg:#388e3c; --pet-accent:#4caf50; }
  .pet[data-skin="night"] { --pet-body:#5c6bc0; --pet-leg:#303f9f; --pet-accent:#7986cb; }
  .pet[data-skin="latte"] { --pet-body:#bcaaa4; --pet-leg:#795548; --pet-accent:#8d6e63; }
  .pet[data-skin="grape"] { --pet-body:#ab47bc; --pet-leg:#7b1fa2; --pet-accent:#ba68c8; }

  /* ===== 配件（设置页手动选，可叠加）===== */
  .acc { position: absolute; display: none; }
  .pet[data-acc~="cap"] .acc.cap { display: block; }
  .pet[data-acc~="sleepcap"] .acc.sleepcap { display: block; }
  .pet[data-acc~="xmascap"] .acc.xmascap { display: block; }
  .pet[data-acc~="scarf"] .acc.scarf { display: block; }
  .pet[data-acc~="phones"] .acc.phones { display: block; }
  .pet[data-acc~="glasses"] .acc.glasses { display: block; }
  .pet[data-acc~="halo"] .acc.halo { display: block; }
  .cap { left: 6px; top: -9px; width: 40px; height: 13px; background: var(--pet-accent, #e67e22); border-radius: 18px 18px 3px 3px; }
  .cap::after { content: ''; position: absolute; right: -8px; bottom: 1px; width: 18px; height: 4px; background: var(--pet-accent, #e67e22); border-radius: 3px; }
  .scarf { left: -3px; top: 17px; width: 58px; height: 8px; background: #e74c3c; border-radius: 4px; }
  .scarf::after { content: ''; position: absolute; left: 8px; top: 6px; width: 9px; height: 13px; background: #e74c3c; border-radius: 3px; }
  .phones { left: -6px; right: -6px; top: -4px; height: 14px; border: 3px solid #455a64; border-bottom: none; border-radius: 20px 20px 0 0; }
  .phones::before, .phones::after { content: ''; position: absolute; bottom: -3px; width: 9px; height: 9px; background: #455a64; border-radius: 50%; }
  .phones::before { left: -4px; } .phones::after { right: -4px; }
  .glasses { left: 5px; top: 2px; width: 42px; height: 13px; }
  .glasses::before, .glasses::after { content: ''; position: absolute; top: 0; width: 12px; height: 12px; border: 2px solid #263238; border-radius: 50%; box-sizing: border-box; background: rgba(255,255,255,.18); }
  .glasses::before { left: 0; } .glasses::after { right: 0; }
  .sleepcap { left: 9px; top: -14px; width: 0; height: 0; border-left: 17px solid transparent; border-right: 17px solid transparent; border-bottom: 16px solid #7986cb; }
  .sleepcap::after { content: ''; position: absolute; left: -5px; top: -8px; width: 9px; height: 9px; border-radius: 50%; background: #fff; }
  .xmascap { left: 9px; top: -14px; width: 0; height: 0; border-left: 17px solid transparent; border-right: 17px solid transparent; border-bottom: 16px solid #e53935; }
  .xmascap::after { content: ''; position: absolute; left: -5px; top: -8px; width: 9px; height: 9px; border-radius: 50%; background: #fff; }
  .xmascap::before { content: ''; position: absolute; left: -17px; top: 11px; width: 34px; height: 5px; background: #fff; border-radius: 3px; }
  /* 成长特征 */
  /* 玩具球：原来头顶那个小圆圈，挪到地上当玩具，自娱自乐时滚出来玩 */
  .toy { position: absolute; left: 14px; bottom: 1px; width: 9px; height: 9px; border-radius: 50%; background: var(--pet-accent, #e67e22); box-shadow: 0 0 6px var(--pet-accent, #e67e22), inset -1px -1px 2px rgba(0,0,0,.22); display: none; z-index: 7; }
  .pet.play-ball .toy { display: block; animation: ballplay 3.4s cubic-bezier(.32,.62,.6,1) forwards; }
  @keyframes ballplay {
    0%   { transform: translate(26px, 3px) scale(.3); opacity: 0; }
    12%  { transform: translate(26px, -12px) scale(1); opacity: 1; }
    26%  { transform: translate(22px, 0) scale(1, .86); }
    40%  { transform: translate(16px, -8px); }
    54%  { transform: translate(10px, 0) scale(1, .88); }
    68%  { transform: translate(4px, -4px); }
    82%  { transform: translate(-2px, 0); }
    92%  { transform: translate(-7px, 0) rotate(-180deg); }
    100% { transform: translate(-13px, 0) scale(.4) rotate(-360deg); opacity: 0; }
  }

  /* 生活化小道具：敲代码/吃煎蛋/玩游戏/喝饮料时出现在手边（参考相册生活场景图）*/
  .prop { position: absolute; font-size: 13px; line-height: 1; z-index: 6; pointer-events: none; opacity: 0; transition: opacity .25s ease; }
  .prop.show { opacity: 1; }
  .prop.bob { animation: propbob 1.3s ease-in-out infinite; }
  @keyframes propbob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }

  /* ===== 手臂动作：手原本是静止方块，现在配合动作动起来 ===== */
  @keyframes armtype  { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
  @keyframes armhold  { 0%,100% { transform: translate(0,0) rotate(0); } 50% { transform: translate(-1px,-4px) rotate(-10deg); } }
  @keyframes armwave  { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-4px) rotate(-14deg); } }
  @keyframes armshake { 0%,100% { transform: translate(0,0); } 25% { transform: translate(-2px,0); } 75% { transform: translate(2px,0); } }
  .pet.arm-type .arm { animation: armtype .32s ease-in-out infinite; }
  .pet.arm-type .arm-right { animation-delay: .16s; }              /* 双手交替敲键盘 */
  .pet.arm-hold .arm { animation: armhold 1.1s ease-in-out infinite; }
  .pet.arm-hold .arm-right { animation-delay: .3s; }                /* 举着东西 */
  .pet.arm-wave .arm { animation: armwave .7s ease-in-out infinite; }
  .pet.arm-wave .arm-right { animation-delay: .12s; }               /* 举手挥舞 */
  .pet.arm-shake .arm { animation: armshake .3s ease-in-out infinite; }  /* 搓洗/握着手柄抖 */
  .halo { left: 12px; top: -15px; width: 28px; height: 8px; border: 2px solid #ffd54f; border-radius: 50%; box-shadow: 0 0 7px #ffd54f; }
  .pet.blush .body::before, .pet.blush .body::after { content: ''; position: absolute; top: 11px; width: 8px; height: 4px; background: #ff8a80; border-radius: 50%; opacity: .85; }
  .pet.blush .body::before { left: 1px; } .pet.blush .body::after { right: 1px; }
  .pet.stareyes .eye { background: transparent; }
  .pet.stareyes .eye::after { content: '★'; position: absolute; left: -2px; top: -4px; font-size: 9px; color: #ffb300; line-height: 1; }

  /* ===== 待机微动作（设置页可开关）===== */
  .pet.idle-breathe .body { animation: breathe 3.2s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(1px) scaleY(.95); } }
  .pet.idle-music { animation: petwig .5s ease-in-out infinite; }
  @keyframes petwig { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }
  .pet.idle-hop { animation: pethop .9s ease-in-out infinite; }
  @keyframes pethop { 0%,100% { transform: translateY(0); } 35% { transform: translateY(-5px); } 60% { transform: translateY(0); } }

  /* ===== 新特效粒子层（汗滴/爱心爆裂/烟花/音符）===== */
  .fxlayer { position: absolute; inset: 0; pointer-events: none; z-index: 6; }
  .fxlayer .p { position: absolute; font-size: 9px; line-height: 1; animation: rise 1.15s ease-out forwards; }
  @keyframes rise { 0% { opacity: 1; transform: translate(0,0) scale(.7); } 100% { opacity: 0; transform: translate(var(--dx, 0), var(--dy, -14px)) scale(1.5); } }
</style>
</head>
<body>
  <div class="pet" id="pet">
    <span class="bubble" id="bubble"></span>
    <span class="handle" id="handle">❯</span>
    <span class="acc halo"></span>
    <span class="toy" id="toy"></span>
    <span class="acc cap"></span>
    <span class="acc sleepcap"></span>
    <span class="acc xmascap"></span>
    <div class="fxlayer" id="fxlayer"></div>
    <span class="fx fx-heart">❤</span>
    <span class="fx fx-tear">💧</span>
    <span class="fx fx-tear r">💧</span>
    <span class="fx fx-star">✨</span>
    <span class="fx fx-zzz">zZz</span>
    <span class="fx fx-smoke">💢</span>
    <span class="fx fx-bubble">🫧</span>
    <span class="fx fx-music">🎧</span>
    <span class="fx fx-note n1">♪</span>
    <span class="fx fx-note n2">♫</span>
    <span class="fx fx-note n3">♪</span>
    <span class="fx fx-exclaim">!</span>
    <span class="fx fx-question">?</span>
    <span class="fx fx-confetti c1">🎉</span>
    <span class="fx fx-confetti c2">🎊</span>
    <span class="fx fx-confetti c3">✨</span>
    <div class="body">
      <div class="eye eye-left"></div>
      <div class="eye eye-right"></div>
      <div class="arm arm-left"></div>
      <div class="arm arm-right"></div>
      <div class="leg leg-left"></div>
      <div class="leg leg-right"></div>
      <span class="acc glasses"></span>
      <span class="acc scarf"></span>
      <span class="acc phones"></span>
    </div>
  </div>

<script>
  const pet = document.getElementById('pet');
  const bubble = document.getElementById('bubble');

  function say(text, ms) {
    // 优先走独立气泡窗口（原生 TextView，文字自适应宽度不截断）；
    // 桥不可用时退回 WebView 内气泡
    try {
      if (window.AndroidBridge) {
        window.AndroidBridge.showBubble(text, ms || 1600);
        return;
      }
    } catch (e) {}
    bubble.textContent = text;
    bubble.classList.add('show');
    clearTimeout(say._t);
    say._t = setTimeout(() => bubble.classList.remove('show'), ms || 1600);
  }
  function bounce() {
    pet.classList.remove('bounce'); void pet.offsetWidth; pet.classList.add('bounce');
  }
  // 设置读取（字符串/整数），桥不可用时用默认值
  function getPrefStr(key, def) {
    try { return window.AndroidBridge ? AndroidBridge.getPrefStr(key, def) : def; } catch (e) { return def; }
  }
  function getPrefInt(key, def) {
    try { return window.AndroidBridge ? AndroidBridge.getPrefInt(key, def) : def; } catch (e) { return def; }
  }

  // 眨眼（设置可关）
  if (getPref('pref_blink', true)) {
    setInterval(() => {
      if (pet.classList.contains('asleep')) return;
      pet.classList.add('blink');
      setTimeout(() => pet.classList.remove('blink'), 130);
    }, 3000 + Math.random() * 1500);
  }

  window.petEngine = {
    onTap: function() {
      if (waterLv > 0) { waterLv = 0; say('咕嘟咕嘟... 喝了！💧'); return; }
      randomSay(GREETS[PERIOD]);
    },
    onDoubleTap: function() { bounce(); say('嘿嘿!'); blushFor(1200); },
    onLongPress: function() { say('唔...'); },
    onDragEnd: function() { say('嘿咻~'); },
    onFling: function() { say('哇!'); },
    // 连击：2秒内连戳 3/5/8 次，层层递进
    onCombo3: function() {
      say('三连击！嘿嘿~');
      pet.classList.add('act-happy');
      blushFor(1500);
      setTimeout(function() { pet.classList.remove('act-happy'); }, 1200);
    },
    onCombo5: function() { say('五连击！！哇哦'); bounce(); blushFor(1800); },
    onCombo8: function() {
      say('八连击！！要被戳坏了🌚');
      pet.classList.add('act-angry');
      var s = document.querySelector('.fx-smoke'); if (s) s.classList.add('show');
      setTimeout(function() { pet.classList.remove('act-angry'); clearFx(); }, 1500);
    },
    // 孤独递进：5/10/15/20分钟无互动
    onLonely1: function() { say('(偷偷看你一眼)'); pet.classList.add('act-wiggle'); setTimeout(function() { pet.classList.remove('act-wiggle'); }, 1500); },
    onLonely2: function() { say('呼~呼~'); var b = document.querySelector('.fx-bubble'); if (b) b.classList.add('show'); setTimeout(function() { if (b) b.classList.remove('show'); }, 3000); },
    onLonely3: function() { pet.classList.add('act-sleepy'); say('zZz... 好困'); },
    onLonely4: function() { pet.classList.add('asleep'); say('(睡熟了...)'); },
    // 边缘跑：沿屏幕边缘滑跑时的动作
    onEdgeRun: function() {
      pet.classList.add('act-wiggle');
      setTimeout(function() { pet.classList.remove('act-wiggle'); }, 2200);
    },
    // 躲猫猫现身：突然出现在随机位置
    onPeekaboo: function() {
      say('嘿嘿 我在这儿！');
      pet.classList.add('act-happy');
      var s = document.querySelector('.fx-star'); if (s) s.classList.add('show');
      setTimeout(function() { pet.classList.remove('act-happy'); clearFx(); }, 1500);
    },
    // 键盘弹出：贴边让开（不挡候选词栏/按键/输入框）
    onKeyboardUp: function() {
      pet.classList.add('act-proud');
      say('你先打，我靠边~');
      setTimeout(function() { pet.classList.remove('act-proud'); }, 4000);
    },
    // 键盘收起：回原位
    onKeyboardHide: function() { say('键盘走啦~'); },
    // AI 消息通道：AI 通过文件推送消息（动作名|文本）
    onAiSay: function(text, action) {
      say(text, 4000);
      if (action && action !== 'none' && ACTIONS.indexOf(action) >= 0) {
        pet.classList.remove('blink');
        ACTIONS.forEach(function(a) { pet.classList.remove('act-' + a); });
        pet.classList.add('act-' + action);
        (FX[action] || []).forEach(function(sel) {
          var el = document.querySelector(sel); if (el) el.classList.add('show');
        });
        // 状态类动作（思考/干活/惊讶/睡觉）持续更久，普通动作短一点
        var hold = (action === 'think' || action === 'run' || action === 'shock' || action === 'sleepy')
          ? 8000 : 2500;
        setTimeout(function() { pet.classList.remove('act-' + action); clearFx(); }, hold);
      } else if (action && FEELS.indexOf(action) >= 0) {
        wakeUp();
        playFeels(action);
      }
    },
    // 亲密度热更新（原生层数完互动次数后调用）：只记录等级，不再自动戴光环/常驻腮红
    setIntimacy: function(lv) {
      pet.dataset.lv = lv;
    },
    // 亲密度升级时的一次性庆祝
    onLevelUp: function(lv) {
      playFeels('firework');
      bounce();
      blushFor(2600);
      say(['', '嘿嘿…有点想黏着你', '我们熟起来啦！', '你还挺喜欢我的嘛', '我一直都在哦✨'][lv] || '嘿嘿');
    },
    // 对外触发：玩球 / 生活小动作（agent 桥与调试可用）
    playBall: function() { playBall(); },
    playLife: function() { playLife(); }
  };

  // 互动时唤醒
  function wakeUp() {
    pet.classList.remove('asleep', 'act-sleepy');
    clearFx();
  }

  // 读取设置开关（原生 SharedPreferences）
  function getPref(key, def) {
    try { return window.AndroidBridge ? AndroidBridge.getPref(key, def) : def; } catch (e) { return def; }
  }

  // 完全隐藏模式：显示边缘手柄（原生层缩小窗口后调用）
  function showHandle(left) {
    pet.classList.add('handle-mode');
    document.getElementById('handle').textContent = left ? '❯' : '❮';
  }
  function showPet() {
    pet.classList.remove('handle-mode');
  }

  pet.addEventListener('click', () => window.petEngine.onTap());

  // ===== 时段感知：按小时换说话风格 =====
  var PERIOD = (function(h) {
    if (h >= 0 && h < 6) return 'lateNight';
    if (h >= 6 && h < 9) return 'morning';
    if (h >= 11 && h < 14) return 'noon';
    if (h >= 22) return 'night';
    return 'day';
  })(new Date().getHours());
  var GREETS = {
    lateNight: ['都这么晚了还不睡吗🌙','熬夜对身体不好哦...','快睡啦！'],
    morning:   ['早安呀～☀️','新的一天！精神满满！','早！'],
    noon:      ['午饭吃了吗？🍚','该吃饭啦～','饿了...'],
    night:     ['晚上好呀～','今天辛苦啦！','夜深了哦🌙'],
    day:       ['嗨~','宝宝!','在呢']
  };
  // 自言自语四词池：日常/黏人/混乱/深夜（按 PERIOD 选池）
  var MUTTERS = {
    lateNight: ['（打个哈欠）好困...','zZz 我还在陪着你','夜深了，宝宝也早点睡','（偷看宝宝一眼）'],
    morning:   ['新的一天也要元气满满！','（伸懒腰）早~','今天也要一起加油！','宝宝早安呀'],
    noon:      ['（摸摸肚子）饿了...','该吃午饭啦宝宝','下午也要精神！','好想喝奶茶'],
    night:     ['今天辛苦啦～','（揉眼睛）晚上好','宝宝今天开心吗？','陪我一会儿嘛'],
    day:       ['（转圈）好无聊呀','宝宝宝宝～','在想什么呢？','我在看你哦～']
  };
  function randomSay(pool) { say(pool[Math.floor(Math.random() * pool.length)]); }

  // ===== 喝水提醒：每2小时，越不理越凶（可开关） =====
  var waterLv = 0;
  var WATER_MSGS = ['该喝水啦～💧','都说了要喝水！💧💧','再不喝我就生气了！(｀へ´)','(盯着你) 水！水！'];
  if (getPref('pref_water', true)) {
    setInterval(function() {
      waterLv++;
      say(WATER_MSGS[(waterLv - 1) % WATER_MSGS.length], 4000);
    }, 2 * 60 * 60 * 1000);
  }

  // ===== 自主小动作：参考相册表情图，随机自觉做 =====
  var ACTIONS = ['happy','sleepy','angry','cry','proud','jump','wiggle','music','shock','think','celebrate','cute','run','roll'];
  // ===== 情绪特效（新）：agent 可直接推 action=stareyes/blush/sweat/heartburst/firework/note =====
  var FEELS = ['stareyes','blush','sweat','heartburst','firework','note'];

  function tempClass(cls, ms) {
    pet.classList.add(cls);
    setTimeout(function() { pet.classList.remove(cls); }, ms || 2000);
  }
  // 腮红：只在特定时刻短暂浮现（Lv3 起解锁），不再常驻挂在脸上
  function blushFor(ms) {
    if (getPrefInt('pref_intimacy_level', 1) < 3) return;
    tempClass('blush', ms || 2000);
  }
  function spawnFx(emoji, n, opts) {
    opts = opts || {};
    var layer = document.getElementById('fxlayer');
    if (!layer) return;
    for (var i = 0; i < n; i++) {
      var s = document.createElement('span');
      s.className = 'p';
      s.textContent = emoji;
      s.style.left = (opts.left != null ? opts.left : 20 + Math.random() * 26) + 'px';
      s.style.top = (opts.top != null ? opts.top : 4) + 'px';
      s.style.setProperty('--dx', (opts.dx != null ? opts.dx : Math.random() * 30 - 15).toFixed(1) + 'px');
      s.style.setProperty('--dy', (opts.dy != null ? opts.dy : -(10 + Math.random() * 14)).toFixed(1) + 'px');
      s.style.animationDelay = (i * 0.07) + 's';
      layer.appendChild(s);
      (function(el) { setTimeout(function() { el.remove(); }, 1700); })(s);
    }
  }
  function playFeels(a) {
    switch (a) {
      case 'stareyes': tempClass('stareyes', 2200); blushFor(1800); break;
      case 'blush': blushFor(2200); break;
      case 'sweat': spawnFx('💧', 2, { left: 52, top: 2, dx: 4, dy: -12 }); break;
      case 'heartburst': spawnFx('❤', 5, { top: 6, dy: -16 }); blushFor(2200); break;
      case 'note': spawnFx('♪', 3, { top: 4, dy: -13 }); spawnFx('♫', 2, { top: 2, dy: -16 }); break;
      case 'firework':
        ['✨','🎆','✨','★','🎇','✨','·','✦'].forEach(function(e, i) {
          spawnFx(e, 1, { left: 26, top: 8, dx: Math.cos(i / 8 * 6.28) * 16, dy: Math.sin(i / 8 * 6.28) * 16 });
        });
        break;
    }
  }

  // ===== 形象装配：皮肤 / 配件 / 待机微动作 / 亲密度成长特征（都读设置）=====
  (function applyLook() {
    var SKINS = ['orange', 'peach', 'mint', 'night', 'latte', 'grape'];
    var skin = getPrefStr('pref_skin', 'orange');
    pet.dataset.skin = (SKINS.indexOf(skin) >= 0) ? skin : 'orange';

    var accs = [];
    // 手动选的配件（设置页勾选，可叠加；帽子类自己别同时勾两个）
    if (getPref('pref_acc_cap', false)) accs.push('cap');
    if (getPref('pref_acc_sleepcap', false)) accs.push('sleepcap');
    if (getPref('pref_acc_xmascap', false)) accs.push('xmascap');
    if (getPref('pref_acc_scarf', false)) accs.push('scarf');
    if (getPref('pref_acc_phones', false)) accs.push('phones');
    if (getPref('pref_acc_glasses', false)) accs.push('glasses');
    if (getPref('pref_acc_halo', false)) accs.push('halo');
    // 亲密度只记录等级：光环改为纯手动配件、腮红改为特定时刻触发（都不再常驻）
    var lv = getPrefInt('pref_intimacy_level', 1);
    pet.dataset.lv = lv;
    pet.dataset.acc = accs.join(' ');

    if (getPref('pref_idle_breathe', true)) pet.classList.add('idle-breathe');
    if (getPref('pref_idle_music', false)) pet.classList.add('idle-music');
    if (getPref('pref_idle_hop', false)) pet.classList.add('idle-hop');
  })();
  var FX = {
    happy: ['.fx-heart'],
    sleepy: ['.fx-zzz'],
    angry: ['.fx-smoke'],
    cry: ['.fx-tear', '.fx-tear.r'],
    proud: ['.fx-star'],
    jump: [],
    wiggle: [],
    music: ['.fx-music', '.fx-note.n1', '.fx-note.n2', '.fx-note.n3'],
    shock: ['.fx-exclaim'],
    think: ['.fx-question'],
    celebrate: ['.fx-confetti.c1', '.fx-confetti.c2', '.fx-confetti.c3'],
    cute: ['.fx-heart'],
    run: [],
    roll: []
  };
  function clearFx() {
    document.querySelectorAll('.fx').forEach(function(el) { el.classList.remove('show'); });
  }
  // ===== 玩具球：Lv2 解锁，自娱自乐时滚出来玩一下（设置页可关）=====
  var BALL_SAYS = ['接住！⚽', '球球～⚽', '看我颠球！', '嘿嘿 好圆'];
  function ballUnlocked() { return getPrefInt('pref_intimacy_level', 1) >= 2; }
  function playBall() {
    if (pet.classList.contains('asleep')) return;
    if (!getPref('pref_toy_ball', true)) return;
    if (!ballUnlocked()) return;
    pet.classList.remove('blink');
    ACTIONS.forEach(function(a) { pet.classList.remove('act-' + a); });
    clearFx(); clearProps(); clearArm();
    pet.classList.add('play-ball', 'act-happy', 'arm-wave');
    spawnFx('❤', 2, { top: 4, dy: -12 });
    if (Math.random() < 0.5) randomSay(BALL_SAYS);
    setTimeout(function() {
      pet.classList.remove('play-ball', 'act-happy');
      clearArm();
      clearFx();
    }, 3450);
  }
  // ===== 生活化自娱自乐：参考相册生活场景图（敲代码/吃煎蛋/玩游戏/喝饮料/种植物/洗衣服/存粮）=====
  var LIFE_ACTS = [
    { prop: '💻', left: 20, top: 19, act: 'act-think',     arm: 'arm-type',  say: ['写代码中…💻', '这个 bug 好难', '（噼里啪啦）'] },
    { prop: '🍳', left: 48, top: 11, act: 'act-happy',     arm: 'arm-hold',  blush: 1, say: ['好吃！🍳', '煎蛋嘿嘿', '再来一份～'] },
    { prop: '🎮', left: 26, top: 18, act: 'act-celebrate', arm: 'arm-shake', say: ['通关啦！🎮', '再来一局嘛', '赢了赢了！'] },
    { prop: '🥤', left: 52, top: 9,  act: 'act-cute',      arm: 'arm-hold',  blush: 1, say: ['咕嘟咕嘟🥤', '快乐水！', '好喝～'] },
    { prop: '🪴', left: 50, top: 19, act: 'act-proud',     arm: 'arm-wave',  say: ['长高一点～🌱', '今天也浇水了', '我的小盆栽'] },
    { prop: '🧺', left: 1,  top: 18, act: 'act-wiggle',    arm: 'arm-shake', say: ['洗衣服好累🧺', '晾起来～', '好多泡泡'] },
    { prop: '🍖', left: 2,  top: 11, act: 'act-happy',     arm: 'arm-wave',  say: ['存粮！🍖', '够吃三天了', '嘿嘿 好香'] }
  ];
  var ARM_CLASSES = ['arm-type', 'arm-hold', 'arm-wave', 'arm-shake'];
  function clearArm() {
    for (var i = 0; i < ARM_CLASSES.length; i++) pet.classList.remove(ARM_CLASSES[i]);
  }
  function clearProps() {
    var ps = pet.querySelectorAll('.prop');
    for (var i = ps.length - 1; i >= 0; i--) { if (ps[i].parentNode) ps[i].parentNode.removeChild(ps[i]); }
  }
  function showProp(emoji, left, top, ms) {
    var el = document.createElement('span');
    el.className = 'prop';
    el.textContent = emoji;
    el.style.left = left + 'px';
    el.style.top = top + 'px';
    pet.appendChild(el);
    void el.offsetWidth;
    el.classList.add('show', 'bob');
    setTimeout(function() {
      el.classList.remove('show');
      setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 400);
    }, ms || 3200);
  }
  function playLife() {
    if (pet.classList.contains('asleep')) return;
    if (!getPref('pref_life_acts', true)) return;
    var L = LIFE_ACTS[Math.floor(Math.random() * LIFE_ACTS.length)];
    pet.classList.remove('blink');
    ACTIONS.forEach(function(a) { pet.classList.remove('act-' + a); });
    clearFx(); clearProps(); clearArm();
    pet.classList.add(L.act, L.arm);
    showProp(L.prop, L.left, L.top, 3200);
    if (L.blush) blushFor(2000);
    if (Math.random() < 0.5) randomSay(L.say[Math.floor(Math.random() * L.say.length)]);
    setTimeout(function() { pet.classList.remove(L.act); clearArm(); }, 3500);
  }
  function runAction() {
    if (pet.classList.contains('asleep')) return;
    if (!getPref('pref_idle_actions', true)) return;
    // 自娱自乐：约 1/3 概率改成自己玩球（Lv2 解锁后）
    if (ballUnlocked() && getPref('pref_toy_ball', true) && Math.random() < 0.35) { playBall(); return; }
    // 约 1/3 概率做生活化小动作（敲代码/吃煎蛋/玩游戏/喝饮料/种植物/洗衣服/存粮）
    if (getPref('pref_life_acts', true) && Math.random() < 0.33) { playLife(); return; }
    // 做小动作时通知原生层从贴边弹出，刷存在感
    try { window.AndroidBridge && window.AndroidBridge.peekOut(); } catch (e) {}
    pet.classList.remove('blink');
    ACTIONS.forEach(function(a) { pet.classList.remove('act-' + a); });
    clearFx();
    var a = ACTIONS[Math.floor(Math.random() * ACTIONS.length)];
    pet.classList.add('act-' + a);
    if (a === 'jump') bounce();
    (FX[a] || []).forEach(function(sel) {
      var el = document.querySelector(sel);
      if (el) el.classList.add('show');
    });
    // 自言自语：约 1/4 概率顺带冒一句独白（日常/黏人/混乱/深夜四词池，按时段）
    if (Math.random() < 0.25) {
      say(MUTTERS[PERIOD][Math.floor(Math.random() * MUTTERS[PERIOD].length)]);
    }
    // 偶尔顺带来个情绪特效（星星眼/脸红/汗滴/爱心/烟花/音符）
    if (Math.random() < 0.22) playFeels(FEELS[Math.floor(Math.random() * FEELS.length)]);
    setTimeout(function() {
      pet.classList.remove('act-' + a);
      clearFx();
    }, 2500);
  }
  // 活跃度：设置页三档（话痨 8 秒 / 正常 45 秒 / 安静 150 秒）
  var ACT_BASE_SEC = Math.max(4, getPrefInt('pref_act_sec', 45));
  setTimeout(function schedule() {
    runAction();
    setTimeout(schedule, ACT_BASE_SEC * 1000 * (0.7 + Math.random() * 0.6));
  }, 4000);

  // ===== 尺寸缩放：AndroidBridge.getPetScale() 返回 1.0~2.5（52×24 ↔ 130×60）=====
  // 用 zoom 而不是 transform，避免覆盖 idle 等动画的 transform
  try {
    var petScale = window.AndroidBridge ? window.AndroidBridge.getPetScale() : 1;
    if (petScale && petScale !== 1) {
      pet.style.zoom = petScale;
    }
    // 气泡宽度跟随窗口：除以缩放比后，视觉上始终不超出悬浮窗（能显示约 20 字）
    var bw = Math.max(60, (window.innerWidth - 16) / (petScale || 1));
    bubble.style.maxWidth = Math.round(bw) + 'px';
  } catch (e) {}

  // 上报桌宠身体在窗口内的相对位置（比例 0~1，原生层用窗口实际尺寸换算成屏幕坐标）。
  // 用比例而不是像素：不依赖 CSS px 与 dp 的换算假设，任何 density 下都精确锚定在头顶。
  try {
    var b = document.querySelector('.body');
    var r = b.getBoundingClientRect();
    window.AndroidBridge && window.AndroidBridge.setPetBodyRect(
      r.left / window.innerWidth,
      r.top / window.innerHeight,
      r.width / window.innerWidth,
      r.height / window.innerHeight
    );
  } catch (e) {}

  randomSay(GREETS[PERIOD]);
</script>
</body>
</html>
