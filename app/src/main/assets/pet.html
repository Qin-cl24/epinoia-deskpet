<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
  body { display: flex; align-items: flex-end; justify-content: center; }

  /* 气泡 (窗口顶部) */
  .bubble {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,.95); color: #333; padding: 2px 6px;
    border-radius: 6px; font-size: 10px; white-space: nowrap;
    box-shadow: 0 1px 3px rgba(0,0,0,.25); opacity: 0; transition: opacity .3s;
    max-width: 42px; overflow: hidden; text-overflow: ellipsis;
    z-index: 10; pointer-events: none;
  }
  .bubble.show { opacity: 1; }

  /* ===== 桌宠形象 ===== */
  .pet {
    /* 高度 50 = 4 上边距 + 36 身体 + 10 腿（腿拉长后要跟着加，否则腿会被裁掉）*/
    position: relative; width: 72px; height: 50px;
    animation: idle 2.5s ease-in-out infinite;
  }
  @keyframes idle { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
  .pet.bounce { animation: bounce .4s ease; }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }

  /* 主体：56×36 —— 身体比例对齐 clawd-icons 的 11:7（主人 2026-10-16 定）。
     原来是 56×32（比 1.75）偏"趴"，现在 1.556 更接近方块。
     圆角保留但收小：6px → 4px（主人要求"角度缩小一点"）。*/
  .body {
    position: relative;
    width: 56px; height: 36px; background: var(--pet-body, #e67e22);
    border-radius: 4px;
    /* 立体方块：顶部高光 + 底部暗边，让它看起来是个有厚度的方块 */
    box-shadow: inset 0 2px 0 rgba(255,255,255,.22), inset 0 -3px 0 rgba(0,0,0,.10);
    margin: 4px auto 0;
  }
  /* 眼睛（两只）：竖长方形（像素小宠物的标准眼型）
     2026-10-15：白色高光点已移除（主人要求，纯黑眼更干净可爱）——原来靠高光撑的"得意"
     改成眨眼表达，见下面「动作表情」。*/
  .eye { position: absolute; width: 5px; height: 10px; background: #000; top: 9px; border-radius: 2px; transition: height .1s, width .15s, transform .15s, border-radius .15s; }
  .eye-left { left: 12px; } .eye-right { right: 12px; }
  /* ===== 面部表情层：只用眼睛说话（2026-10-15 定稿）=====
     主人判断：萌系小宠物「没有嘴、没有眉毛」最可爱 —— 整套嘴（.mouth）与眉毛（.brow）
     规则已全部删除，情绪改由四种手段表达：
       ① 眼型（竖条 / 圆 / 上拱弯顶 / 下垂弧 / 半眯）
       ② 眼神（平移、扫动）  ③ 角度（斜眼、外八字）  ④ 脸部特效（泪滴、生气红纹）
     眼型定义集中放在下面「动作表情」段；这里只留不依赖眼型的脸部特效。
     历史：嘴眉方案见 commit 71688b9 / 540ee67 / 0c9ccad，想回退对比可从那里取。*/
  /* 生气：脸颊红色竖条纹 —— 只保留左脸（2026-10-15 主人要求去掉右脸那两个红点：
     恼怒 💢 标记要放到方块右上角，右脸再画红纹就和它撞位了）*/
  .pet.act-angry::before {
    content: ''; position: absolute; width: 3px; height: 8px; border-radius: 1px;
    background: repeating-linear-gradient(180deg, #e53935 0 2px, transparent 2px 4px);
    top: 19px; left: 13px;
  }
  /* 哭：两滴眼泪贴在眼睛正下方（外侧一格），并且朝向互换 —— 反向旋转抵消眼睛的外八字，
     让水滴是「竖直往下掉」的，而不是跟着斜眼一起歪着 */
  .pet.act-cry .eye::before { content: ''; position: absolute; top: 3px; width: 3px; height: 6px; background: #81d4fa; border-radius: 50% 50% 50% 50% / 70% 70% 30% 30%; }
  .pet.act-cry .eye-left::before { left: -3px; transform: rotate(16deg); }
  .pet.act-cry .eye-right::before { right: -3px; transform: rotate(-16deg); }
  .pet.blink .eye { height: 2px; }
  /* 手：小正方形、与身体同色、垂直居中、紧贴身体两侧无缝隙 */
  /* 手的颜色按前后关系走（主人 2026-10-21 定）：
     身前的手比身体**浅一点**（受光），伸到身后的手**灰一点**（在身体的阴影里）。*/
  .arm {
    position: absolute; width: 10px; height: 10px; top: 12px;
    background-color: var(--pet-body, #e67e22);
    background-image: linear-gradient(180deg, rgba(255,255,255,.20), rgba(255,255,255,.05));
  }
  /* 伸到身体后面的手：去饱和 + 压暗，读起来像被身体挡住了 */
  .pet .arm.arm-behind { filter: saturate(.45) brightness(.85); }
  .arm-left { left: -8px; } .arm-right { right: -8px; }
  /* 腿：四条细腿（细一点、左右各两条靠近且对称）
     2026-10-16：对齐 clawd 比例 —— 他们的脚是身体高的 29%，我们原来只有 17%，显得"腿短"。
     所以 6px → 10px，并给腿加一段「身体色 → 腿色」的竖直渐变做过渡，
     不然腿和身体之间是一道生硬的颜色断口。*/
  .leg {
    position: absolute; width: 5px; height: 10px; bottom: -10px; border-radius: 0;
    background: linear-gradient(180deg, var(--pet-body, #e67e22) 0%, var(--pet-leg, #d35400) 58%);
  }
  .leg-l1 { left: 8px; } .leg-l2 { left: 17px; } .leg-r2 { right: 17px; } .leg-r1 { right: 8px; }
  /* 走路步态：对角腿一起抬（像猫狗小跑），拖动/边缘跑时生效；腿变长了，抬腿幅度也加到 4px */
  @keyframes walkA { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes walkB { 0%,100% { transform: translateY(-4px); } 50% { transform: translateY(0); } }
  .pet.walking .leg-l1, .pet.walking .leg-r2 { animation: walkA .32s ease-in-out infinite; }
  .pet.walking .leg-l2, .pet.walking .leg-r1 { animation: walkB .32s ease-in-out infinite; }
  .pet.walking { animation: none; }   /* 走路时用腿部表现，别和整体 idle 上下浮动打架 */
  /* 地面影子：垫在身体和腿之下
     2026-10-21：身体变高 + 腿拉长后重算 —— 四只脚实际踩在 .pet 的 x16~52、y50 这条线上，
     所以影子收到脚底下（bottom:0）、宽度收到 46（比脚掌略宽），虚化加重一点表示"身子抬高了"。*/
  .shadow { position: absolute; left: 13px; bottom: 0; width: 46px; height: 6px; background: rgba(0,0,0,.22); border-radius: 50%; filter: blur(1.1px); pointer-events: none; }
  /* 杂耍：三个彩色小球，走杂技式抛接弧线（左手上抛→空中画弧→落回），错峰接力 */
  .ball { position: absolute; top: 8px; width: 7px; height: 7px; border-radius: 50%; display: none; z-index: 8; }
  .pet.juggling .ball { display: block; }
  .ball.b1 { left: 12px; background: #ff5252; box-shadow: 0 0 4px #ff5252; animation: tossA 1.15s ease-in-out infinite; }
  .ball.b2 { left: 30px; background: #ffca28; box-shadow: 0 0 4px #ffca28; animation: tossB 1.15s ease-in-out infinite .38s; }
  .ball.b3 { left: 47px; background: #42a5f5; box-shadow: 0 0 4px #42a5f5; animation: tossC 1.15s ease-in-out infinite .76s; }
  @keyframes tossA { 0%,100% { transform: translate(0,0) } 50% { transform: translate(14px,-26px) } }
  @keyframes tossB { 0%,100% { transform: translate(-8px,0) } 50% { transform: translate(8px,-28px) } }
  @keyframes tossC { 0%,100% { transform: translate(-14px,0) } 50% { transform: translate(0,-26px) } }

  /* ===== 自主小动作特效 ===== */
  .fx { position: absolute; display: none; pointer-events: none; z-index: 5; font-size: 9px; }
  .fx.show { display: block; animation: fxrise 1.2s ease-out forwards; }
  @keyframes fxrise { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-14px) scale(1.4); } }
  .fx-heart { top: -6px; left: 30px; color: #ff2d55; filter: drop-shadow(0 0 3px rgba(255,45,85,.55)); }
  /* 眼泪 emoji（配合哭的 CSS 泪滴）：落到眼睛外侧更下方，四滴连成"眼泪往下掉"的一条线 */
  .fx-tear  { top: 25px; left: 3px; }
  .fx-tear.r{ top: 25px; left: auto; right: 3px; }
  .fx-star  { top: -6px; left: 46px; }
  .fx-zzz   { top: -9px; left: 42px; font-size: 7px; }
  /* 恼怒 💢：主标记在方块右上角（2026-10-16 下移贴角），生气期间一直脉动 */
  .fx-smoke { top: -3px; right: 2px; font-size: 11px; }
  /* 第二个小一点的 💢：放在「另一侧那只手的正上方」，和主标记错开半拍脉动 —— 气到冒两个火 */
  .fx-smoke2 { top: 4px; left: 0px; font-size: 8px; }
  @keyframes angermark { 0%,100% { opacity: .55; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.15); } }
  .pet.act-angry .fx-smoke { display: block; animation: angermark .7s ease-in-out infinite; }
  .pet.act-angry .fx-smoke2 { display: block; animation: angermark .7s ease-in-out infinite .35s; }
  .fx-bubble { top: 6px; left: 6px; font-size: 7px; }
  .fx-music { top: -8px; left: 27px; font-size: 10px; }
  .fx-note { font-size: 7px; }
  .fx-note.n1 { top: -6px; left: 6px; animation-delay: .1s; }
  .fx-note.n2 { top: 0px;  left: 58px; animation-delay: .35s; }
  .fx-note.n3 { top: -10px; left: 38px; animation-delay: .6s; }
  .fx-exclaim { top: -8px; left: 30px; font-size: 11px; color: #e53935; font-weight: bold; }
  .fx-question { top: -10px; left: 30px; font-size: 10px; color: #666; font-weight: bold; }
  .fx-confetti { font-size: 8px; }
  .fx-confetti.c1 { top: -4px; left: 4px; animation-delay: 0s; }
  .fx-confetti.c2 { top: -2px; left: 56px; animation-delay: .2s; }
  .fx-confetti.c3 { top: -8px; left: 30px; animation-delay: .4s; }

  /* ===== 动作表情 ① 眼型：没有嘴和眉之后，眼睛要一个人撑起全部情绪 ===== */
  /* 开心 / 庆祝：^ ^ 线条式眯眼
     做法：border-top + border-right 拼出一个「折角」，再 rotate(-45deg) 把这个角转到正上方 = ∧。
     比原来的 ∩ 圆顶更"线条"，就是动画片里那种弯弯的笑眼。*/
  .act-happy .eye, .act-celebrate .eye {
    width: 6px; height: 6px; top: 10px; background: none; border-radius: 1px;
    border-top: 2px solid #000; border-right: 2px solid #000;
    transform: rotate(-45deg);
  }
  /* 害羞：> < 线条眼（同一个折角，转 45° 顶点朝右 = > ；转 225° 顶点朝左 = <）
     踩坑：右眼一开始写成 135°，那是**朝下**的 ∨（折角顶点方向 = 未旋转时的「右上」随旋转角一起转），
     135°+90°=225° 才是朝左的 <。主人一眼看出来的，记在这里免得以后再错。*/
  .act-shy .eye {
    width: 6px; height: 6px; top: 10px; background: none; border-radius: 1px;
    border-top: 2px solid #000; border-right: 2px solid #000;
  }
  .act-shy .eye-left { transform: rotate(45deg); }    /* 左眼 ">"（顶点朝右） */
  .act-shy .eye-right { transform: rotate(225deg); }  /* 右眼 "<"（顶点朝左） */
  /* 得意：一只眼得意地眨（左眼睁开盯着你 + 右眼上拱眯起）+ ✨ —— 高光去掉后这是最不撞脸的做法 */
  .act-proud .eye-left { top: 8px; }
  .act-proud .eye-right { height: 4px; border-radius: 3px 3px 0 0; }
  /* 犯困：∪ 形下垂眼（眼睛往下弯）*/
  .act-sleepy .eye { height: 4px; border-radius: 0 0 3px 3px; }
  /* 惊讶：瞪成圆眼（最重要的情绪档）*/
  .act-shock .eye { width: 7px; height: 7px; border-radius: 50%; }
  /* 撒娇：大圆眼 */
  .act-cute .eye { width: 7px; height: 9px; border-radius: 50%; }
  /* 菱形眼（心动 / 兴奋 / 闪亮）：用 clip-path 切成 ◆，比圆眼更有"眼睛里冒星星"的味道 */
  .act-diamond .eye { width: 8px; height: 10px; top: 8px; border-radius: 0; clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
  .act-diamond .eye-left { left: 11px; }
  .act-diamond .eye-right { right: 11px; }
  /* 生气：斜眼（双眼朝内下压） + 脸颊红纹 */
  .act-angry .eye-left { transform: rotate(-45deg); }
  .act-angry .eye-right { transform: rotate(45deg); }
  /* 哭：压成细线 + 外八字下垂（配合泪滴，与"笑眼"彻底区分开）*/
  .act-cry .eye { height: 2px; border-radius: 1px; }
  .act-cry .eye-left { transform: rotate(-16deg); }
  .act-cry .eye-right { transform: rotate(16deg); }
  /* 思考：半眯 + 眼神偏右上（想事情时眼神会往上飘）*/
  .act-think .eye { height: 6px; transform: translate(1px, -1px); }
  /* 听歌 / 唱歌：左右眼交替眨动（跟着节拍打拍子）*/
  @keyframes winkbeat { 0%,100% { height: 2px; } 42%,58% { height: 8px; border-radius: 2px; } }
  .act-music .eye-left { animation: winkbeat .9s ease-in-out infinite; }
  .act-music .eye-right { animation: winkbeat .9s ease-in-out infinite .45s; }
  /* 看书：半眯 + 眼睛左右扫行（一行一行读下去）*/
  @keyframes readscan { 0%,100% { transform: translate(-1px, 0); } 50% { transform: translate(1px, 0); } }
  .act-read .eye { height: 6px; animation: readscan 2.6s ease-in-out infinite; }

  /* ===== 动作表情 ② 身体动画 ===== */
  .act-sleepy { animation: yawn 2.4s ease-in-out infinite; }
  @keyframes yawn { 0%,100% { transform: translateY(0) scaleY(1); } 25% { transform: translateY(-3px) scaleY(1.1); } 50% { transform: translateY(0) scaleY(1); } }
  .act-angry { animation: shake .3s ease-in-out 6; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } }
  .act-cry { animation: crybob 1.2s ease-in-out infinite; }
  @keyframes crybob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(1px); } }
  .act-proud { animation: proudbob .8s ease-in-out infinite; }
  @keyframes proudbob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  .act-wiggle { animation: wiggle .5s ease-in-out 4; }
  @keyframes wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-7deg); } 75% { transform: rotate(7deg); } }
  .act-music { animation: wiggle .45s ease-in-out 6; }
  .act-shock { animation: bounce .35s ease 2; }
  .act-think { animation: thinkbob 1s ease-in-out infinite; }
  @keyframes thinkbob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
  .act-celebrate { animation: wiggle .3s ease-in-out 6; }
  /* 看书：身体轻微起伏（像呼吸着读），别用大动作，专心才有读书味 */
  @keyframes readbob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-1px); } }
  .pet.act-read .body { animation: readbob 3.2s ease-in-out infinite; }
  .act-run { animation: run .15s linear infinite; }
  @keyframes run { 0%,100% { transform: translateY(0) rotate(0); } 25% { transform: translateY(-1px) rotate(-4deg); } 75% { transform: translateY(1px) rotate(4deg); } }
  /* 趴键盘 */
  .act-crouch { animation: crouch 1.5s ease-in-out infinite; }
  @keyframes crouch { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(.8) translateY(3px); } }
  /* 睡着 */
  .pet.asleep { opacity: .65; animation: none; }
  /* 完全隐藏时显示边缘手柄 */
  .handle {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-size: 20px; color: rgba(230, 126, 34, .55); display: none; z-index: 20;
    line-height: 1;
  }
  .pet.handle-mode .body, .pet.handle-mode .fx, .pet.handle-mode .bubble { display: none; }
  .pet.handle-mode .handle { display: block; }
  /* 翻滚动作 */
  .act-roll { animation: roll .6s ease 1; }
  @keyframes roll { from { transform: rotate(0); } to { transform: rotate(360deg); } }

  /* ===== 皮肤（CSS 变量，设置页可切）===== */
  /* 默认橙调粉一档（主人要求整体偏粉）*/
  .pet[data-skin="orange"] { --pet-body:#f39a80; --pet-leg:#dc7a5c; --pet-accent:#f7ac95; }
  .pet[data-skin="peach"] { --pet-body:#f48fb1; --pet-leg:#ec407a; --pet-accent:#f06292; }
  .pet[data-skin="mint"]  { --pet-body:#66bb6a; --pet-leg:#388e3c; --pet-accent:#4caf50; }
  .pet[data-skin="night"] { --pet-body:#5c6bc0; --pet-leg:#303f9f; --pet-accent:#7986cb; }
  .pet[data-skin="latte"] { --pet-body:#bcaaa4; --pet-leg:#795548; --pet-accent:#8d6e63; }
  .pet[data-skin="grape"] { --pet-body:#ab47bc; --pet-leg:#7b1fa2; --pet-accent:#ba68c8; }

  /* ===== 配件（设置页手动选，可叠加）===== */
  /* 配件要在身体上层：.body 在 DOM 里排在配件之后，不给 z-index 会把配件盖住 */
  .acc { position: absolute; display: none; z-index: 9; }
  .pet[data-acc~="cap"] .acc.cap { display: block; }
  .pet[data-acc~="sleepcap"] .acc.sleepcap { display: block; }
  .pet[data-acc~="xmascap"] .acc.xmascap { display: block; }
  .pet[data-acc~="scarf"] .acc.scarf { display: block; }
  .pet[data-acc~="phones"] .acc.phones { display: block; }
  .pet[data-acc~="glasses"] .acc.glasses { display: block; }
  .pet[data-acc~="halo"] .acc.halo { display: block; }
  .pet[data-acc~="cowboy"] .acc.cowboy { display: block; }
  .pet[data-acc~="dive"] .acc.dive { display: block; }
  .pet[data-acc~="helmet"] .acc.helmet { display: block; }
  .pet[data-acc~="tutu"] .acc.tutu { display: block; }
  .pet[data-acc~="tophat"] .acc.tophat { display: block; }
  .pet[data-acc~="partyhat"] .acc.partyhat { display: block; }
  .pet[data-acc~="wizhat"] .acc.wizhat { display: block; }
  .cap { left: 8px; top: -6px; width: 40px; height: 13px; background: var(--pet-accent, #e67e22); border-radius: 18px 18px 3px 3px; }
  .cap::after { content: ''; position: absolute; right: -8px; bottom: 1px; width: 18px; height: 4px; background: var(--pet-accent, #e67e22); border-radius: 3px; }
  .scarf { left: -3px; top: 24px; width: 62px; height: 8px; background: #e74c3c; border-radius: 4px; }
  .scarf::after { content: ''; position: absolute; left: 8px; top: 6px; width: 9px; height: 13px; background: #e74c3c; border-radius: 3px; }
  .phones { left: -6px; right: -6px; top: -4px; height: 14px; border: 3px solid #455a64; border-bottom: none; border-radius: 20px 20px 0 0; }
  .phones::before, .phones::after { content: ''; position: absolute; bottom: -3px; width: 9px; height: 9px; background: #455a64; border-radius: 50%; }
  .phones::before { left: -4px; } .phones::after { right: -4px; }
  .glasses { left: 7px; top: 8px; width: 42px; height: 13px; }
  .glasses::before, .glasses::after { content: ''; position: absolute; top: 0; width: 12px; height: 12px; border: 2px solid #263238; border-radius: 50%; box-sizing: border-box; background: rgba(255,255,255,.18); }
  .glasses::before { left: 0; } .glasses::after { right: 0; }
  .sleepcap { left: 11px; top: -11px; width: 0; height: 0; border-left: 17px solid transparent; border-right: 17px solid transparent; border-bottom: 16px solid #7986cb; }
  .sleepcap::after { content: ''; position: absolute; left: -5px; top: -8px; width: 9px; height: 9px; border-radius: 50%; background: #fff; }
  .xmascap { left: 11px; top: -9px; width: 0; height: 0; border-left: 17px solid transparent; border-right: 17px solid transparent; border-bottom: 16px solid #e53935; }
  .xmascap::after { content: ''; position: absolute; left: -5px; top: -8px; width: 9px; height: 9px; border-radius: 50%; background: #fff; }
  .xmascap::before { content: ''; position: absolute; left: -17px; top: 11px; width: 34px; height: 5px; background: #fff; border-radius: 3px; }
  /* 成长特征 */
  /* 玩具球：原来头顶那个小圆圈，挪到地上当玩具，自娱自乐时滚出来玩 */
  .toy { position: absolute; left: 14px; bottom: 1px; width: 9px; height: 9px; border-radius: 50%; background: var(--pet-accent, #e67e22); box-shadow: 0 0 6px var(--pet-accent, #e67e22), inset -1px -1px 2px rgba(0,0,0,.22); display: none; z-index: 7; }
  .pet.play-ball .toy { display: block; animation: ballplay 3.4s cubic-bezier(.32,.62,.6,1) forwards; }
  @keyframes ballplay {
    0%   { transform: translate(26px, 3px) scale(.3); opacity: 0; }
    12%  { transform: translate(26px, -12px) scale(1); opacity: 1; }
    26%  { transform: translate(22px, 0) scale(1, .86); }
    40%  { transform: translate(16px, -8px); }
    54%  { transform: translate(10px, 0) scale(1, .88); }
    68%  { transform: translate(4px, -4px); }
    82%  { transform: translate(-2px, 0); }
    92%  { transform: translate(-7px, 0) rotate(-180deg); }
    100% { transform: translate(-13px, 0) scale(.4) rotate(-360deg); opacity: 0; }
  }

  /* 生活化小道具：敲代码/吃煎蛋/玩游戏/喝饮料时出现在手边（参考相册生活场景图）*/
  .prop { position: absolute; font-size: 13px; line-height: 1; z-index: 6; pointer-events: none; opacity: 0; transition: opacity .25s ease; }
  .prop.show { opacity: 1; }
  .prop.bob { animation: propbob 1.3s ease-in-out infinite; }
  @keyframes propbob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }

  /* ===== 看书：CSS 手绘的摊开小书（刻意不用 emoji，和另外 13 个 emoji 道具区分开）=====
     两页纸 + 淡淡的字行纹理 + 中间书脊暗缝 + 右页轻微翻动。
     位置在胸前下缘（y23，刚好是去掉嘴之后空出来的那块），配 arm-hold 像双手举着读。
     与身体同步做 readbob 起伏，手和书不会分离。*/
  .book { position: absolute; left: 26px; top: 23px; width: 20px; height: 11px; z-index: 7; display: none; pointer-events: none; }
  .pet.act-read .book { display: block; animation: readbob 3.2s ease-in-out infinite; }
  .bk {
    position: absolute; bottom: 0; width: 10px; height: 11px; box-sizing: border-box;
    background-color: #fffdf3; border: 1px solid #c9b79a;
    /* 淡淡的字行：只在页面内侧画几条横线，远看像排好版的字 */
    background-image: repeating-linear-gradient(180deg, #d9cdb6 0 1px, transparent 1px 3px);
    background-size: 6px 9px; background-repeat: no-repeat; background-position: 2px 2px;
  }
  .bk-l { left: 0; border-radius: 2px 1px 1px 2px; transform: perspective(30px) rotateY(16deg); transform-origin: right center; }
  .bk-r { right: 0; border-radius: 1px 2px 2px 1px; transform: perspective(30px) rotateY(-16deg); transform-origin: left center; animation: pageflip 3.4s ease-in-out infinite; }
  @keyframes pageflip { 0%,62%,100% { transform: perspective(30px) rotateY(-16deg); } 80% { transform: perspective(30px) rotateY(-3deg); } }
  /* 书脊：两页中间的暗缝，做出"摊开"的立体感 */
  .book::after { content: ''; position: absolute; left: 9px; top: 1px; width: 2px; height: 9px; background: rgba(0,0,0,.16); border-radius: 1px; }

  /* ===== 情景动作道具（2026-10-21 新增）=====
     参考主人下载的 clawd-island 情景动画（在给你写信 / 在看外面 / 惦记你身体 …），
     做成我们自己的四个"情景动作"。道具全部是细线条风格：1px 描边、无填充，
     跟方块身体的「细线 + 纯色块」语言统一，也呼应 clawd-icons 那套线条物件。
     坐标都在 .pet 的 72×50 坐标系里。*/
  .scene { position: absolute; z-index: 7; display: none; pointer-events: none; box-sizing: border-box; }
  .pet.act-letter .scene.letter,
  .pet.act-window .scene.window,
  .pet.act-food   .scene.bowl,
  .pet.act-food   .scene.dice,
  .pet.act-travel .scene.case,
  .pet.act-fish   .scene.rod,
  .pet.act-rose   .scene.rose,
  .pet.act-care   .scene.cup { display: block; }

  /* 写信：信纸（四行字）+ 笔
     分镜照 clawd-island 的 letter：低头写两行 → 折起来 → 装进信封 → 举起来给你看 */
  .scene.letter { left: 23px; top: 21px; width: 16px; height: 13px; background: #fffdf6; border: 1px solid #8d8072; border-radius: 2px; }
  .pet.act-letter .scene.letter { animation: letterBeat 4.4s ease-in-out infinite; }
  @keyframes letterBeat {
    0%, 32%  { transform: rotate(-7deg) scale(1); }
    46%      { transform: rotate(-3deg) scale(.92); }
    58%, 78% { transform: rotate(0deg) scale(.72); }
    90%,100% { transform: rotate(0deg) scale(.78) translateY(-7px); }
  }
  .scene.letter::before { content: ''; position: absolute; left: 3px; top: 3px; width: 9px; height: 1px; background: #b9ac99; box-shadow: 0 3px 0 #b9ac99, 0 6px 0 #b9ac99, 0 9px 0 #b9ac99; }
  .scene.letter::after { content: ''; position: absolute; right: -4px; bottom: -4px; width: 2px; height: 11px; background: #5d5246; border-radius: 1px; transform: rotate(28deg); }

  /* 钓鱼：斜举的鱼竿 + 垂下的鱼线 + 一沉一浮的浮漂
     分镜照 clawd-island 的 fish：等浮漂 → 打瞌睡 → 拽空了挠头 */
  .scene.rod { left: 30px; top: -4px; width: 36px; height: 2px; background: #6d6155; border-radius: 1px; transform: rotate(-30deg); transform-origin: left center; }
  .scene.rod::before { content: ''; position: absolute; right: 0; top: 1px; width: 1px; height: 24px; background: #8d8072; }
  .scene.rod::after { content: ''; position: absolute; right: -2px; top: 23px; width: 5px; height: 5px; border-radius: 50%; background: #e53935; animation: bobber 1.8s ease-in-out infinite; }
  @keyframes bobber { 0%,100% { transform: translateY(0); } 45% { transform: translateY(4px); } 70% { transform: translateY(-1px); } }

  /* ==== 手与道具：接触位置 + 前后明暗（2026-10-21 主人定）====
     ① 身前的手比身体**浅一档**（受光），伸到身后的手加 .arm-behind 变灰（在身体阴影里）
     ② 拿着道具的手必须落在道具边沿，并和道具共用同一套节奏曲线 */
  .pet.act-read .arm, .pet.act-care .arm, .pet.act-food .arm,
  .pet.act-letter .arm, .pet.act-travel .arm, .pet.act-fish .arm,
  .pet.act-rose .arm, .pet.act-window .arm {
    background-color: var(--pet-body, #e67e22);
    background-image: linear-gradient(180deg, rgba(255,255,255,.34), rgba(255,255,255,.12));
    border-radius: 3px;
    box-shadow: 0 0 0 1px rgba(0,0,0,.14), inset 0 2px 0 rgba(255,255,255,.45);
  }
  /* 递热水：双手捧在杯子左右两侧，跟着杯子一起矮下、捧起、递出 */
  .pet.act-care .arm-left  { left: 14px; top: 24px; }
  .pet.act-care .arm-right { right: 15px; top: 24px; }
  .pet.act-care .arm-left  { left: 14px; top: 24px; }
  @keyframes careHands {
    0%, 12%   { transform: translateY(3px); }
    26%, 44%  { transform: translateY(0); }
    58%       { transform: translateY(-3px); }
    78%, 100% { transform: translateY(-4px); }
  }
  .pet.act-care .arm { animation: careHands 8s ease-in-out infinite; }

  /* 递热水：细线杯子 + 三缕往上升的热气
     分镜照 clawd-island 的 care 十秒脚本，压成 8 秒六幕：
       低头看杯 → 抬眼皱眉看你 → 吹两下（眯眼）→ 眯眼笑 → 双手捧起来 → 往前一递 → 冒心等你接 */
  .scene.cup { left: 27px; top: 25px; width: 12px; height: 13px; border: 1px solid #8d8072; border-radius: 2px 2px 4px 4px; background: rgba(255,253,246,.8); }
  .pet.act-care .scene.cup { animation: cupBeat 8s ease-in-out infinite; }
  @keyframes cupBeat {
    0%, 12%   { transform: translateY(3px) scale(.95); }
    26%, 44%  { transform: translateY(0) scale(1); }
    58%       { transform: translateY(-3px) scale(1); }
    78%, 100% { transform: translateY(-4px) scale(1.12); }
  }
  .scene.cup::before { content: ''; position: absolute; left: 2px; top: -7px; width: 1px; height: 5px; background: #b9ac99; box-shadow: 4px 0 0 #b9ac99, 8px 0 0 #b9ac99; animation: steamUp 2s ease-in-out infinite; }
  @keyframes steamUp { 0%,100% { opacity: .3; transform: translateY(1px); } 50% { opacity: .9; transform: translateY(-3px); } }

  /* 拿玫瑰：细线条的玫瑰（花头 + 茎 + 一片叶），**右手捏在花茎上**，手和花一起晃
     分镜：举着晃两下 → 举到脸边 → 眯眼闻（腮红）→ 轻轻放下 */
  .scene.rose { left: 33px; top: 22px; width: 9px; height: 9px; border-radius: 50%; background: #e0536b; box-shadow: inset 0 -2px 0 rgba(0,0,0,.18); }
  .scene.rose::before { content: ''; position: absolute; left: 3px; top: 8px; width: 2px; height: 10px; background: #4e7a3a; border-radius: 1px; }
  .scene.rose::after { content: ''; position: absolute; left: 1px; top: 11px; width: 6px; height: 3px; border-radius: 50% 50% 50% 0; background: #5c8c45; transform: rotate(-18deg); }
  .pet.act-rose .scene.rose { animation: roseBeat 8s ease-in-out infinite; }
  @keyframes roseBeat {
    /* 闻花那一幕只抬高 4px —— 花头的上沿必须留在眼睛下方（主人 2026-10-21 要求：不能高于眼睛）*/
    0%, 20%   { transform: rotate(-6deg); }
    30%, 42%  { transform: rotate(7deg) translateY(-2px); }
    52%, 70%  { transform: rotate(-2deg) translateY(-4px); }
    82%, 100% { transform: rotate(0) translateY(0); }
  }
  /* 右手捏着花茎（茎在 body 的 x26~28），跟着花一起晃、一起抬到脸边 */
  .pet.act-rose .arm-right { right: 22px; top: 28px; animation: roseHand 8s ease-in-out infinite; }
  @keyframes roseHand {
    0%, 20%   { transform: rotate(-5deg); }
    30%, 42%  { transform: rotate(6deg) translateY(-2px); }
    52%, 70%  { transform: rotate(0) translateY(-4px); }
    82%, 100% { transform: rotate(0); }
  }
  @keyframes roseEyes {
    0%, 44%   { height: 8px; }
    52%, 70%  { height: 3px; border-radius: 0 0 3px 3px; }
    78%, 100% { height: 8px; border-radius: 2px; }
  }
  .pet.act-rose .eye { animation: roseEyes 8s ease-in-out infinite; }

  /* 等吃的：骰子（掷骰子选晚饭）+ 一碗面
     分镜照 clawd-island 的 food 十秒脚本：
       抱着骰子想 → 左右摇 → 扔出去翻转掉落 → 落地吓一蹦 >< → 凑近看点数 → 冒出一碗面 ^^ → 搓手 */
  .scene.dice { left: 27px; top: 21px; width: 11px; height: 11px; border: 1px solid #8d8072; border-radius: 2px; background: #fffdf6; box-sizing: border-box; }
  .scene.dice::before { content: ''; position: absolute; left: 2px; top: 2px; width: 2px; height: 2px; border-radius: 50%; background: #5d5246; box-shadow: 3px 3px 0 #5d5246, 6px 6px 0 #5d5246; }
  /* 上面的三点：2~4 / 5~7 / 8~10，正好落在 11px 骰面内，不再溢出边线 */
  /* 等吃的：完整照 clawd food 的**十幕脚本**（10 秒十拍，主人说四镜太生硬）
     0 抱着骰子想吃什么 → 1 举起来往左摇 → 2 往右摇 → 3 扔出去 → 4 翻着往下掉
     → 5 落地吓一蹦 → 6 凑近看是几 → 7 冒出一碗面并拍手 → 8 搓手 → 9 搓手，面收回骰子捡回 */
  .pet.act-food .scene.dice { animation: diceBeat 10s ease-in-out infinite; }
  @keyframes diceBeat {
    0%, 8%    { transform: translate(0,-1px) rotate(-3deg);      opacity: 1; }  /* 抱在怀里想 */
    12%, 18%  { transform: translate(-6px,-5px) rotate(-16deg);  opacity: 1; }  /* 往左摇 */
    22%, 28%  { transform: translate(6px,-6px) rotate(18deg);    opacity: 1; }  /* 往右摇 */
    32%, 38%  { transform: translate(14px,-8px) rotate(120deg);  opacity: 1; }  /* 扔出去 */
    42%, 48%  { transform: translate(16px,6px) rotate(280deg);   opacity: 1; }  /* 翻着往下掉 */
    52%, 58%  { transform: translate(16px,14px) rotate(360deg);  opacity: 1; }  /* 落地 */
    62%, 68%  { transform: translate(16px,14px) rotate(360deg) scale(.94); opacity: 1; } /* 凑近看 */
    72%, 96%  { transform: translate(16px,14px) rotate(360deg);  opacity: 0; }  /* 面出来后收走 */
    100%      { transform: translate(0,-1px) rotate(-3deg);      opacity: 0; }
  }
  .pet.act-food .scene.bowl { animation: bowlPop 10s ease-in-out infinite; }
  @keyframes bowlPop {
    0%, 68%   { opacity: 0; transform: scale(.3) translateY(6px); }
    74%, 88%  { opacity: 1; transform: scale(1) translateY(0); }     /* 面端上来 */
    94%, 100% { opacity: 0; transform: scale(.6) translateY(3px); }  /* 收回去 */
  }
  @keyframes foodEyes {
    0%, 10%   { height: 10px; }                                  /* 想吃什么 */
    14%, 28%  { height: 3px; }                                   /* 摇骰子，眯眼使劲 */
    32%, 48%  { height: 10px; }                                  /* 盯着飞出去的骰子 */
    52%, 60%  { height: 3px; transform: rotate(-16deg); }        /* 落地吓一跳 >< */
    64%, 70%  { height: 8px; transform: none; }                  /* 凑近看点数 */
    74%, 86%  { height: 5px; border-radius: 3px 3px 0 0; }       /* 面来了 ^^ */
    92%, 100% { height: 10px; border-radius: 2px; }
  }
  .pet.act-food .eye { animation: foodEyes 10s ease-in-out infinite; }
  @keyframes foodHop {
    0%, 50%   { transform: translateY(0); }
    54%       { transform: translateY(-7px); }   /* 骰子落地吓一蹦 */
    58%       { transform: translateY(0); }
    61%       { transform: translateY(-2px); }
    64%, 100% { transform: translateY(0); }
  }
  .pet.act-food .body { animation: foodHop 10s ease-in-out infinite; }
  /* 手：0~30% 夹着骰子 → 扔出去松手并后缩 → 落地时扶一下 → 70% 后捧碗、拍手、搓手 */
  @keyframes foodHandL {
    /* 前 30% 手要跟着骰子一起晃（骰子往左 6px、往右 6px），不然就是"骰子自己抖、手不动" */
    0%, 8%    { transform: translate(0,0); }
    12%, 18%  { transform: translate(-6px,-4px); }
    22%, 28%  { transform: translate(6px,-4px); }
    34%, 50%  { transform: translate(-4px,-6px) rotate(-8deg); }
    56%, 68%  { transform: translate(-2px,4px); }
    74%, 88%  { transform: translate(-3px,8px) rotate(-6deg); }
    92%, 100% { transform: translate(0,8px) rotate(-10deg); }
  }
  @keyframes foodHandR {
    0%, 8%    { transform: translate(0,0); }
    12%, 18%  { transform: translate(-6px,-4px); }
    22%, 28%  { transform: translate(6px,-4px); }
    34%, 50%  { transform: translate(4px,-6px) rotate(8deg); }
    56%, 68%  { transform: translate(2px,4px); }
    74%, 88%  { transform: translate(3px,8px) rotate(6deg); }
    92%, 100% { transform: translate(0,8px) rotate(10deg); }
  }
  .pet.act-food .arm-left  { animation: foodHandL 10s ease-in-out infinite; }
  .pet.act-food .arm-right { animation: foodHandR 10s ease-in-out infinite; }
  /* 等吃的：双手一开始夹着骰子（骰子在 body 的 x19~30）*/
  .pet.act-food .arm-left  { left: 11px; top: 18px; }
  .pet.act-food .arm-right { right: 18px; top: 18px; }

  /* 写信：左手按住信纸左缘，右手握着笔在纸上写（笔在纸的右下角，所以右手也压在那里）*/
  .pet.act-letter .arm-left  { left: 11px; top: 22px; }
  .pet.act-letter .arm-right { right: 22px; top: 24px; }
  .pet.act-letter .arm-left  { left: 11px; top: 22px; }
  @keyframes writeHand {
    0%, 100% { transform: translate(0,0); }
    25%      { transform: translate(-2px,-1px); }
    50%      { transform: translate(1px,1px); }
    75%      { transform: translate(-1px,0); }
  }
  .pet.act-letter .arm-right { animation: writeHand .9s ease-in-out infinite; }

  /* 出门：左手攥着行李箱的提手（箱子在身体左侧），跟着走路节奏左右摆 */
  .pet.act-travel .arm-left { left: -2px; top: 16px; }
  @keyframes caseHand {
    0%, 100% { transform: rotate(0); }
    50%      { transform: rotate(-8deg); }
  }
  .pet.act-travel .arm-left { animation: caseHand .64s ease-in-out infinite; }
  /* 出门时右手在身体另一侧（箱子后面那一侧），按前后关系压灰 */
  .pet.act-travel .arm-right { filter: saturate(.45) brightness(.88); }

  /* 钓鱼：右手攥着鱼竿手柄（竿根在 body 的 x22,y-8），轻微摇竿 */
  .pet.act-fish .arm-right { right: auto; left: 20px; top: -8px; width: 7px; height: 12px; }
  @keyframes rodHand {
    0%, 100% { transform: rotate(0); }
    50%      { transform: rotate(-5deg); }
  }
  .pet.act-fish .arm-right { animation: rodHand 2.4s ease-in-out infinite; }

  /* 看窗外：双手扒在窗台上（放在身体底部），接雨那一幕右手再抬出去 */
  .pet.act-window .arm-left, .pet.act-window .arm-right { top: 28px; }

  /* 看窗外：整块窗框垫在身体**下面**（DOM 里排在 .body 之前、z-index:0），
     身体挡住中间，只露出边框和一圈天空色 —— 像桌宠坐在窗边。这样绝不会挡住眼睛。
     分镜照 clawd-island 的 window 十秒脚本，压缩成 8 秒五幕：
       雨丝下落 → 闭眼听雨 → 伸爪接雨 → 凉得 >< → 雨停月亮升起 + 蹦起来 ^^ */
  .scene.window { left: 1px; top: 0; width: 70px; height: 45px; border: 1px solid #8d8072; border-radius: 3px; background: linear-gradient(180deg, #cfe8ff 0%, #eaf6ff 100%); z-index: 0; overflow: hidden; }
  .scene.window::before { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: #8d8072; opacity: .55; z-index: 2; }
  .scene.window::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: #8d8072; opacity: .55; z-index: 2; }
  /* 雨丝：斜线纹理往下走，前 5 秒有、之后停 */
  .scene.window .rain { position: absolute; inset: 0; background-image: repeating-linear-gradient(105deg, rgba(120,160,200,.7) 0 1px, transparent 1px 5px); background-size: 40px 40px; animation: rainFall .9s linear infinite, rainShow 8s steps(1) infinite; }
  @keyframes rainFall { from { background-position: 0 0; } to { background-position: -8px 20px; } }
  @keyframes rainShow { 0%,46% { opacity: .95; } 47%,100% { opacity: 0; } }
  /* 云：前 5.5 秒在左边，雨停后往右飘走 */
  .scene.window .cloud { position: absolute; left: 5px; top: 6px; width: 17px; height: 6px; border-radius: 3px; background: #eef3f8; border: 1px solid #cfd8e3; animation: cloudMove 8s ease-in-out infinite; }
  @keyframes cloudMove { 0%,46% { transform: translateX(0); opacity: .95; } 62% { transform: translateX(16px); opacity: .55; } 74%,100% { transform: translateX(26px); opacity: 0; } }
  /* 月亮：雨停后升起来，第六幕最亮 */
  .scene.window .moon { position: absolute; right: 7px; top: 5px; width: 9px; height: 9px; border-radius: 50%; background: #ffe58f; box-shadow: 0 0 6px rgba(255,229,143,.85); animation: moonShow 8s ease-in-out infinite; }
  @keyframes moonShow { 0%,50% { opacity: 0; transform: translateY(5px) scale(.5); } 64%,82% { opacity: 1; transform: translateY(0) scale(1); } 92%,100% { opacity: .2; transform: translateY(2px) scale(.8); } }

  /* 吃碗饭：细线碗（下半圆） + 碗口线 + 两缕热气 */
  .scene.bowl { left: 25px; top: 30px; width: 18px; height: 10px; border: 1px solid #8d8072; border-top: none; border-radius: 0 0 9px 9px; background: rgba(255,253,246,.75); }
  .scene.bowl::before { content: ''; position: absolute; left: -1px; right: -1px; top: 0; height: 1px; background: #8d8072; }
  .scene.bowl::after { content: ''; position: absolute; left: 4px; top: -7px; width: 1px; height: 5px; background: #b9ac99; box-shadow: 6px 0 0 #b9ac99; border-radius: 1px; }

  /* 出门旅行：细线行李箱 + 提手 + 一条横缝 */
  .scene.case { left: 2px; top: 24px; width: 13px; height: 15px; border: 1px solid #8d8072; border-radius: 2px; background: rgba(255,253,246,.85); }
  .scene.case::before { content: ''; position: absolute; left: 3px; top: -4px; width: 5px; height: 4px; border: 1px solid #8d8072; border-bottom: none; border-radius: 2px 2px 0 0; }
  .scene.case::after { content: ''; position: absolute; left: 3px; right: 3px; top: 5px; height: 1px; background: #b9ac99; }

  /* 四个情景的配套眼神/身体小动作 */
  .act-letter .eye { height: 6px; transform: translateY(1px); }              /* 低头看信纸 */
  /* ==== 看窗外的表演分镜（8 秒，和上面窗景的关键帧同步）==== */
  @keyframes windowEyes {
    0%, 12%   { height: 8px; }                              /* 扒着窗台看雨 */
    18%, 30%  { height: 2px; }                              /* 闭眼听雨 */
    36%, 44%  { height: 8px; }                              /* 睁眼看钳子接雨 */
    48%, 58%  { height: 2px; transform: rotate(-16deg); }   /* 凉得 ><（眯眼外八字）*/
    64%, 72%  { height: 8px; transform: none; }             /* 抬头看天 */
    76%, 86%  { height: 4px; border-radius: 3px 3px 0 0; }  /* 月亮出来 ^^ */
    92%, 100% { height: 8px; border-radius: 2px; }
  }
  .pet.act-window .eye { animation: windowEyes 8s ease-in-out infinite; }
  /* 第三幕：右手伸出窗外接雨 */
  @keyframes windowArm {
    0%, 32%   { transform: translate(0,0) rotate(0); }
    36%, 44%  { transform: translate(9px,-7px) rotate(-20deg); }
    50%, 100% { transform: translate(0,0) rotate(0); }
  }
  .pet.act-window .arm-right { animation: windowArm 8s ease-in-out infinite; }
  /* 第六幕：月亮出来时蹦一下 */
  @keyframes windowHop {
    0%, 72%   { transform: translateY(0); }
    77%       { transform: translateY(-7px); }
    83%       { transform: translateY(0); }
    88%       { transform: translateY(-3px); }
    93%, 100% { transform: translateY(0); }
  }
  .pet.act-window .body { animation: windowHop 8s ease-in-out infinite; }
  @keyframes chew { 0%,100% { transform: translateY(0); } 50% { transform: translateY(1px); } }
  .act-food .eye { height: 6px; animation: chew .8s ease-in-out infinite; }  /* 咀嚼时眼神一顿一顿 */
  .act-travel .leg-l1, .act-travel .leg-r2 { animation: walkA .32s ease-in-out infinite; }
  .act-travel .leg-l2, .act-travel .leg-r1 { animation: walkB .32s ease-in-out infinite; }

  /* ===== 手臂动作：手原本是静止方块，现在配合动作动起来 ===== */
  @keyframes armtype  { 0%,100% { transform: translateY(0); } 50% { transform: translateY(3px); } }
  @keyframes armhold  { 0%,100% { transform: translate(0,0) rotate(0); } 50% { transform: translate(-1px,-4px) rotate(-10deg); } }
  @keyframes armwave  { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-4px) rotate(-14deg); } }
  @keyframes armshake { 0%,100% { transform: translate(0,0); } 25% { transform: translate(-2px,0); } 75% { transform: translate(2px,0); } }
  .pet.arm-type .arm { animation: armtype .32s ease-in-out infinite; }
  .pet.arm-type .arm-right { animation-delay: .16s; }              /* 双手交替敲键盘 */
  .pet.arm-hold .arm { animation: armhold 1.1s ease-in-out infinite; }
  .pet.arm-hold .arm-right { animation-delay: .3s; }                /* 举着东西 */
  .pet.arm-wave .arm { animation: armwave .7s ease-in-out infinite; }
  .pet.arm-wave .arm-right { animation-delay: .12s; }               /* 举手挥舞 */
  .pet.arm-shake .arm { animation: armshake .3s ease-in-out infinite; }  /* 搓洗/握着手柄抖 */
  /* 手与道具的交互：按动作把手移到道具该在的位置（高度 + 横向收拢）*/
  .pet.arm-type .arm { top: 7px; }        /* 敲键盘：手放低在键位上 */
  .pet.arm-type .arm-left { left: -4px; } .pet.arm-type .arm-right { right: -4px; }
  .pet.arm-hold .arm { top: 5px; }        /* 举着东西：手抬一点 */
  .pet.arm-hold .arm-right { right: -4px; }
  .pet.arm-shake .arm { top: 7px; }       /* 握手柄/搓洗 */
  .pet.arm-shake .arm-left { left: -3px; } .pet.arm-shake .arm-right { right: -3px; }
  .pet.arm-wave .arm { top: 4px; }        /* 举手挥舞：手抬起来 */
  /* 看书专用手势：两只手（小方块）捧在书的左右两侧外沿、且比书略低一点。
     关键点：手和身体同色，缩进身体里就完全看不见（会像没手），所以
       ① 手横跨书的外沿 2px（"捏住"书边）② 加 1px 暗轮廓 + 底部暗边，让它从身体上"浮"出来。
     坐标相对 .body：书占 x18~38 / y19~30；左手 x12~20、右手 x36~44，正好各压住书外沿。
     右手每 3.4 秒抬起一下，和右页 pageflip 同步（都在周期 58%~86%），看起来像在翻页。*/
  .pet.act-read .arm {
    top: 21px; width: 9px; height: 10px; border-radius: 3px; animation: armread 3.4s ease-in-out infinite;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,.20), 0 0 0 1px rgba(0,0,0,.13);
  }
  .pet.act-read .arm-left { left: 12px; }
  .pet.act-read .arm-right { right: 12px; animation: armflip 3.4s ease-in-out infinite; }
  @keyframes armread { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-1px) rotate(-4deg); } }
  @keyframes armflip { 0%,58%,100% { transform: translateY(0) rotate(0); } 72% { transform: translateY(-3px) rotate(-9deg); } 86% { transform: translateY(0) rotate(0); } }

  /* ===== 会伸长的手 =====
     手臂平时是 8×8 的短方块（主人说"短得挺可爱"），所以不改常态；
     只在特定动作里把手臂「拉长」去够东西 —— 举手、摸脑袋。
     注意：手和身体同色，伸出来时必须带暗轮廓才不会糊在身体上（看书那次的教训）。*/
  /* 举手：右臂从 8×8 拉成 7×18、立到方块顶上方，来回轻摆（像在喊"我我我"）*/
  @keyframes armup { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-2px) rotate(-9deg); } }
  .pet.act-raise .arm-right {
    width: 7px; height: 18px; top: -14px; right: -7px; border-radius: 4px;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.18), 0 0 0 1px rgba(0,0,0,.12);
    animation: armup .7s ease-in-out infinite;
  }
  /* 摸脑袋：左臂伸长弯到头顶左侧，以肩为轴小幅摇（挠头 / 不好意思）*/
  @keyframes armrub { 0%,100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
  .pet.act-scratch .arm-left {
    width: 9px; height: 14px; top: -10px; left: 7px; border-radius: 7px 7px 3px 3px;
    transform-origin: bottom center;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.18), 0 0 0 1px rgba(0,0,0,.12);
    animation: armrub .6s ease-in-out infinite;
  }
  /* 杂耍专用接球手势：手举到最高，跟着球的节奏上下托 */
  .pet.juggling .arm { top: 1px; animation: armcatch 1.05s ease-in-out infinite; }
  .pet.juggling .arm-left { left: -4px; } .pet.juggling .arm-right { right: -4px; }
  .pet.juggling .arm-right { animation-delay: .35s; }
  @keyframes armcatch { 0%,100% { transform: translateY(3px) rotate(0); } 50% { transform: translateY(-8px) rotate(-12deg); } }
  .halo { left: 16px; top: -15px; width: 28px; height: 8px; border: 2px solid #ffd54f; border-radius: 50%; box-shadow: 0 0 7px #ffd54f; }
  /* 参考像素小人图的新配件（牛仔帽/潜水镜/赛车头盔/芭蕾裙）*/
  .cowboy { left: 6px; top: -7px; width: 44px; height: 11px; background: #8d6e63; border-radius: 8px 8px 2px 2px; }
  .cowboy::after { content: ''; position: absolute; left: -6px; bottom: -3px; width: 56px; height: 4px; background: #6d4c41; border-radius: 4px; }
  .dive { left: 12px; top: 13px; width: 40px; height: 11px; border: 3px solid #26c6da; border-radius: 9px; background: rgba(38,198,218,.22); }
  .dive::after { content: ''; position: absolute; right: -9px; top: 2px; width: 7px; height: 3px; background: #0097a7; border-radius: 2px; }
  .helmet { left: 5px; top: -10px; width: 46px; height: 22px; background: #e53935; border-radius: 23px 23px 4px 4px; }
  .helmet::after { content: ''; position: absolute; left: 5px; top: 9px; width: 36px; height: 7px; background: rgba(255,255,255,.8); border-radius: 4px; }
  .tutu { left: -8px; top: 21px; width: 68px; height: 10px; background: #f8bbd0; border-radius: 50%; box-shadow: inset 0 2px 0 rgba(244,143,177,.9); }
  /* 礼帽 / 派对帽 / 巫师帽（灵感来自 clawd-on-desk 的配件清单，自己用 CSS 重画）*/
  .tophat { left: 14px; top: -10px; width: 28px; height: 15px; background: #212121; border-radius: 2px 2px 0 0; }
  .tophat::after { content: ''; position: absolute; left: -7px; bottom: -3px; width: 42px; height: 4px; background: #212121; border-radius: 3px; }
  .partyhat { left: 16px; top: -15px; width: 0; height: 0; border-left: 13px solid transparent; border-right: 13px solid transparent; border-bottom: 20px solid #ff7043; }
  .partyhat::after { content: ''; position: absolute; left: -4px; top: -6px; width: 8px; height: 8px; border-radius: 50%; background: #ffd54f; }
  /* 巫师帽：整体用一个多边形画出（尖顶向右上弯 + 宽帽檐），不再是拼接的三角+补丁
     注意：帽子本身不带星星 —— 星星是「情绪」用的特效（见 .fx-star / proud 动作）*/
  .wizhat { left: 12px; top: -22px; width: 34px; height: 26px; background: linear-gradient(175deg, #7e57c2 0%, #5e35b1 60%, #4a2a94 100%); clip-path: polygon(46% 0%, 56% 4%, 66% 16%, 78% 52%, 90% 88%, 100% 100%, 0% 100%, 8% 86%, 20% 46%); }
  .wizhat::after { content: ''; position: absolute; left: -6px; bottom: -3px; width: 46px; height: 4px; background: #4527a0; border-radius: 3px; }  /* 帽檐 */
  .wizstar { display: none; }   /* 已废弃：星星属于情绪特效，不作为帽子装饰 */
  .pet.blush .body::before, .pet.blush .body::after { content: ''; position: absolute; top: 20px; width: 8px; height: 4px; background: #ff8a80; border-radius: 50%; opacity: .85; }
  .pet.blush .body::before { left: 1px; } .pet.blush .body::after { right: 1px; }
  .pet.stareyes .eye { background: transparent; }
  .pet.stareyes .eye::after { content: '★'; position: absolute; left: -2px; top: -4px; font-size: 9px; color: #ffb300; line-height: 1; }

  /* ===== 待机微动作（设置页可开关）===== */
  .pet.idle-breathe .body { animation: breathe 3.2s ease-in-out infinite; }
  @keyframes breathe { 0%,100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(1px) scaleY(.95); } }
  .pet.idle-music { animation: petwig .5s ease-in-out infinite; }
  @keyframes petwig { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }
  .pet.idle-hop { animation: pethop .9s ease-in-out infinite; }
  @keyframes pethop { 0%,100% { transform: translateY(0); } 35% { transform: translateY(-5px); } 60% { transform: translateY(0); } }

  /* ===== 新特效粒子层（汗滴/爱心爆裂/烟花/音符）===== */
  .fxlayer { position: absolute; inset: 0; pointer-events: none; z-index: 6; }
  .fxlayer .p { position: absolute; font-size: 9px; line-height: 1; animation: rise 1.15s ease-out forwards; }
  @keyframes rise { 0% { opacity: 1; transform: translate(0,0) scale(.7); } 100% { opacity: 0; transform: translate(var(--dx, 0), var(--dy, -14px)) scale(1.5); } }
</style>

<body>

<script>
  const pet = document.getElementById('pet');
  const bubble = document.getElementById('bubble');

  function say(text, ms) {
    // 优先走独立气泡窗口（原生 TextView，文字自适应宽度不截断）；
    // 桥不可用时退回 WebView 内气泡
    try {
      if (window.AndroidBridge) {
        window.AndroidBridge.showBubble(text, ms || 1600);
        return;
      }
    } catch (e) {}
    bubble.textContent = text;
    bubble.classList.add('show');
    clearTimeout(say._t);
    say._t = setTimeout(() => bubble.classList.remove('show'), ms || 1600);
  }
  function bounce() {
    pet.classList.remove('bounce'); void pet.offsetWidth; pet.classList.add('bounce');
  }
  // 设置读取（字符串/整数），桥不可用时用默认值
  function getPrefStr(key, def) {
    try { return window.AndroidBridge ? AndroidBridge.getPrefStr(key, def) : def; } catch (e) { return def; }
  }
  function getPrefInt(key, def) {
    try { return window.AndroidBridge ? AndroidBridge.getPrefInt(key, def) : def; } catch (e) { return def; }
  }

  // 眨眼（设置可关）
  if (getPref('pref_blink', true)) {
    setInterval(() => {
      if (pet.classList.contains('asleep')) return;
      pet.classList.add('blink');
      setTimeout(() => pet.classList.remove('blink'), 130);
    }, 3000 + Math.random() * 1500);
  }

  window.petEngine = {
    onTap: function() {
      if (waterLv > 0) { waterLv = 0; say('咕嘟咕嘟... 喝了！💧'); return; }
      randomSay(GREETS[PERIOD]);
    },
    onDoubleTap: function() { bounce(); say('嘿嘿!'); blushFor(1200); },
    onLongPress: function() { say('唔...'); },
    onDragEnd: function() { say('嘿咻~'); },
    onFling: function() { say('哇!'); },
    // 连击：2秒内连戳 3/5/8 次，层层递进
    onCombo3: function() {
      say('三连击！嘿嘿~');
      pet.classList.add('act-happy');
      blushFor(1500);
      setTimeout(function() { pet.classList.remove('act-happy'); }, 1200);
    },
    onCombo5: function() { say('五连击！！哇哦'); bounce(); blushFor(1800); },
    onCombo8: function() {
      say('八连击！！要被戳坏了🌚');
      pet.classList.add('act-angry');
      var s = document.querySelector('.fx-smoke'); if (s) s.classList.add('show');
      setTimeout(function() { pet.classList.remove('act-angry'); clearFx(); }, 1500);
    },
    // 孤独递进：5/10/15/20分钟无互动
    onLonely1: function() { say('(偷偷看你一眼)'); pet.classList.add('act-wiggle'); setTimeout(function() { pet.classList.remove('act-wiggle'); }, 1500); },
    onLonely2: function() { say('呼~呼~'); var b = document.querySelector('.fx-bubble'); if (b) b.classList.add('show'); setTimeout(function() { if (b) b.classList.remove('show'); }, 3000); },
    onLonely3: function() { pet.classList.add('act-sleepy'); say('zZz... 好困'); },
    onLonely4: function() { pet.classList.add('asleep'); say('(睡熟了...)'); },
    // 边缘跑：沿屏幕边缘滑跑时的动作
    onEdgeRun: function() {
      pet.classList.add('act-wiggle', 'walking');
      setTimeout(function() { pet.classList.remove('act-wiggle'); }, 2200);
      setTimeout(function() { pet.classList.remove('walking'); }, 2400);
    },
    // 躲猫猫现身：突然出现在随机位置
    onPeekaboo: function() {
      say('嘿嘿 我在这儿！');
      pet.classList.add('act-happy');
      var s = document.querySelector('.fx-star'); if (s) s.classList.add('show');
      setTimeout(function() { pet.classList.remove('act-happy'); clearFx(); }, 1500);
    },
    // 键盘弹出：贴边让开（不挡候选词栏/按键/输入框）
    onKeyboardUp: function() {
      pet.classList.add('act-proud');
      say('你先打，我靠边~');
      setTimeout(function() { pet.classList.remove('act-proud'); }, 4000);
    },
    // 键盘收起：回原位
    onKeyboardHide: function() { say('键盘走啦~'); },
    // AI 消息通道：AI 通过文件推送消息（动作名|文本）
    onAiSay: function(text, action) {
      say(text, 4000);
      if (action && action !== 'none' && ACTIONS.indexOf(action) >= 0) {
        pet.classList.remove('blink');
        ACTIONS.forEach(function(a) { pet.classList.remove('act-' + a); });
        pet.classList.add('act-' + action);
        (FX[action] || []).forEach(function(sel) {
          var el = document.querySelector(sel); if (el) el.classList.add('show');
        });
        if (action === 'shy') blushFor(2600);   // 害羞：> < 眼 + 脸红一起上（Lv3 起才有腮红）
        // 状态类动作（思考/干活/惊讶/睡觉/看书）持续更久，普通动作短一点
        // 情景动作（写信/看窗外/吃饭/出门/钓鱼/递热水）都是 8 秒的分镜动画，必须给足时间，
        // 否则分镜演到一半就被撤掉（2026-10-21 踩过：拍 4 秒那一帧时窗外道具已经消失了）
        var SLOW = ['rose','think','run','shock','sleepy','read','letter','window','food','travel','fish','care'];
        var hold = SLOW.indexOf(action) >= 0 ? 10600 : 2500;   // 十幕动画要 10 秒，留 0.6 秒余量
        if (SLOW.indexOf(action) >= 0) markBusy(hold + 200);
        setTimeout(function() { pet.classList.remove('act-' + action); clearFx(); }, hold);
      } else if (action && FEELS.indexOf(action) >= 0) {

  // 用比例而不是像素：不依赖 CSS px 与 dp 的换算假设，任何 density 下都精确锚定在头顶。
  try {
    var b = document.querySelector('.body');
    var r = b.getBoundingClientRect();
    window.AndroidBridge && window.AndroidBridge.setPetBodyRect(
      r.left / window.innerWidth,
      r.top / window.innerHeight,
      r.width / window.innerWidth,
      r.height / window.innerHeight
    );
  } catch (e) {}

  randomSay(GREETS[PERIOD]);
</script>
</body>
</html>
